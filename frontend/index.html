<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Monitor</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1419;color:#e6e6e6;font-family:ui-sans-serif,system-ui,sans-serif;padding:12px}
.d{max-width:900px;margin:auto}
.h{display:flex;justify-content:space-between;align-items:center;padding-bottom:12px;border-bottom:1px solid #2d3548;margin-bottom:12px}
.h h1{font-size:18px;background:linear-gradient(135deg,#667eea,#764ba2);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.dot{width:8px;height:8px;border-radius:50%;background:#4ecdc4;display:inline-block;margin-right:6px}
.err .dot{background:#ff6b6b}
.c{display:flex;gap:8px;margin-bottom:12px}
.b{padding:6px 12px;background:#1a1f2e;color:#e6e6e6;border:1px solid #2d3548;border-radius:4px;cursor:pointer;font-size:12px}
.b:hover{background:#2d3548}
.s{padding:6px 10px;background:#1a1f2e;color:#e6e6e6;border:1px solid #2d3548;border-radius:4px;font-size:12px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin-bottom:12px}
.card{background:#1e2530;border:1px solid #2d3548;border-radius:8px;padding:12px}
.card h3{font-size:11px;color:#a0a0a0;text-transform:uppercase;margin-bottom:8px;letter-spacing:.5px}
.v{font-size:22px;font-weight:700;text-align:right;margin-top:4px}
svg{width:100%;height:80px;display:block}
.t{width:100%;border-collapse:collapse;font-size:12px}
.t th{background:#1a1f2e;padding:6px;text-align:left;color:#a0a0a0;font-weight:600;border-bottom:1px solid #2d3548}
.t td{padding:6px;border-bottom:1px solid #2d3548}
.f{display:flex;justify-content:space-between;margin-top:12px;font-size:11px;color:#a0a0a0;padding-top:8px;border-top:1px solid #2d3548}
.m{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);align-items:center;justify-content:center}
.m.show{display:flex}
.mc{background:#1e2530;border:1px solid #2d3548;border-radius:8px;padding:16px;max-width:320px;width:90%}
.mc p{color:#a0a0a0;margin:8px 0 12px;font-size:13px}
</style>
</head>
<body>
<div class="d">
  <div class="h">
    <h1>System Monitor</h1>
    <div id="s" class="dot"></div>
  </div>
  <div class="c">
    <button class="b" onclick="update()">Refresh</button>
    <select class="s" id="f" onchange="update()">
      <option value="code">VS Code</option>
      <option value="chrome">Chrome</option>
      <option value="firefox">Firefox</option>
      <option value="all">All</option>
    </select>
  </div>
  <div class="g">
    <div class="card">
      <h3>CPU</h3>
      <svg id="cpuC"></svg>
      <div class="v"><span id="cpuV">0</span>%</div>
    </div>
    <div class="card">
      <h3>RAM</h3>
      <svg id="ramC"></svg>
      <div class="v"><span id="ramV">0</span>%</div>
    </div>
    <div class="card">
      <h3>Network</h3>
      <svg id="netC"></svg>
      <div class="v" style="font-size:13px"><span id="sent">0</span> / <span id="rec">0</span></div>
    </div>
  </div>
  <div class="card">
    <h3>Processes <span id="pc" style="float:right;color:#4ecdc4">0</span></h3>
    <table class="t">
      <thead><tr><th>PID</th><th>Name</th><th>CPU</th><th>MEM</th></tr></thead>
      <tbody id="pb"></tbody>
    </table>
  </div>
  <div class="f">
    <span id="lu">Never</span>
    <span>1s</span>
  </div>
</div>
<div class="m" id="m">
  <div class="mc">
    <b style="color:#ff6b6b">Error</b>
    <p id="me">Connection failed</p>
    <button class="b" onclick="document.getElementById('m').classList.remove('show')">Close</button>
  </div>
</div>
<script>
const U='http://localhost:8000',N=30;
let chartCache={cpu:[],ram:[],net:[]},pCtr=0;
const B=['B','KB','MB','GB'];
function fB(b){if(!b)return'0 B';const k=1024,i=Math.min(Math.log(b)/Math.log(k)|0,B.length-1);return(b/Math.pow(k,i)).toFixed(1)+' '+B[i]}
function fT(t){const d=new Date(t);return d.getHours()+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0')}
function spark(id,data,color){
  const s=document.getElementById(id),w=s.clientWidth||240,h=80;
  if(!data.length){s.innerHTML='';return}
  const max=Math.max(...data)||1,min=Math.min(...data),range=max-min||1;
  const step=w/(data.length-1);
  let path='M0 '+(h-((data[0]-min)/range*(h-8)+4));
  for(let i=1;i<data.length;i++)path+=' L'+(i*step)+' '+(h-((data[i]-min)/range*(h-8)+4));
  s.innerHTML='<path d="'+path+'" fill="none" stroke="'+color+'" stroke-width="2"/><path d="'+path+' L'+w+' '+h+' L0 '+h+' Z" fill="'+color+'20" opacity="0.3"/>';
}
async function fetchD(name){
  const url=name==='all'?U+'/?code=': U+'/?code='+name;
  const r=await fetch(url);if(!r.ok)throw new Error(r.status);return r.json();
}
async function fetchH(){
  const r=await fetch(U+'/history?limit='+N);if(!r.ok)return[];return r.json();
}
function updateCharts(h){
  if(!h||!h.length)return;
  const l=h.length,labels=new Array(l),cpu=new Array(l),ram=new Array(l),s=new Array(l),r=new Array(l);
  for(let i=0;i<l;i++){
    const x=h[i];labels[i]=fT(x.timestamp);cpu[i]=x.cpu;ram[i]=x.ram_percent;s[i]=x.bytes_sent;r[i]=x.bytes_received;
  }
  spark('cpuC',cpu,'#ff6b6b');spark('ramC',ram,'#4ecdc4');
  chartCache.net.push(s[l-1]);chartCache.net.push(r[l-1]);if(chartCache.net.length>20)chartCache.net.splice(0,2);
  spark('netC',chartCache.net,'#45b7d1');
  const last=l-1;
  document.getElementById('cpuV').textContent=cpu[last].toFixed(1);
  document.getElementById('ramV').textContent=ram[last].toFixed(1);
  document.getElementById('sent').textContent=fB(s[last]);
  document.getElementById('rec').textContent=fB(r[last]);
}
function updateProc(ps){
  const b=document.getElementById('pb'),n=document.getElementById('pc');
  if(!ps||!ps.length){b.innerHTML='<tr><td colspan="4" style="text-align:center;color:#a0a0a0">-</td></tr>';n.textContent='0';return}
  n.textContent=ps.length;let h='';for(let i=0;i<ps.length;i++)h+='<tr><td>'+ps[i].pid+'</td><td>'+ps[i].name+'</td><td>'+(ps[i].cpu_percent||0).toFixed(1)+'%</td><td>'+(ps[i].memory_percent||0).toFixed(1)+'%</td></tr>';b.innerHTML=h;
}
function err(e){document.getElementById('me').textContent=e;document.getElementById('m').classList.add('show');document.getElementById('s').classList.add('err')}
async function update(){
  const f=document.getElementById('f').value;
  try{
    const[d,h]=await Promise.all([fetchD(f),fetchH()]);
    updateCharts(h);pCtr++;if(pCtr%5===0)updateProc(d.processes);
    document.getElementById('lu').textContent='Updated '+new Date().toLocaleTimeString();document.getElementById('s').classList.remove('err');
  }catch(e){err(e.message)}
}
setInterval(update,1000);
document.addEventListener('DOMContentLoaded',update);
</script>
</body>
</html>
